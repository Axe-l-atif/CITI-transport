services:
  - type: web
    name: citi-transport
    runtime: python
    plan: free
    autoDeploy: true
    branch: main
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CITI_DEBUG
        value: "0"
      - key: CTI_PUBLIC_URL
        value: https://citi-transport.onrender.com
