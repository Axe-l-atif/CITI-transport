services:
  - type: web
    name: cti-transport-abidjan
    runtime: python
    plan: free
    autoDeploy: true
    branch: cti-abidjan
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CITI_DEBUG
        value: "0"
